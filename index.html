<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
    <meta name="googlebot" content="noindex, nofollow">
    <title>Minimalist Homepage Design</title>
  </head>
  <body>
    <!-- Password Gate -->
    <div id="gate" aria-live="polite">
      <form id="gate-form" autocomplete="off">
        <h1>private preview</h1>
        <p>enter password to continue</p>
        <input id="gate-input" type="password" placeholder="password" required>
        <button type="submit">enter</button>
        <p id="gate-error" role="alert" hidden>incorrect password. try again.</p>
      </form>
    </div>

    <!-- Real site (hidden until auth passes) -->
    <div id="app" hidden>
      <!-- Global preview banner (shows on all pages after login) -->
      <div id="preview-banner" role="note" aria-live="polite">
        <span>Reminder, this is a preview build :) - v2.1</span>
        <button id="logout" type="button" aria-label="logout">logout</button>
      </div>

      <div id="root"></div>
    </div>

    <style>
      /* Gate styles */
      #gate{
        position:fixed; inset:0; display:grid; place-items:center;
        background:#000; color:#fff; z-index:9999;
        font-family:"Space Mono","IBM Plex Mono",monospace;
      }
      #gate-form{ display:grid; gap:.75rem; width:min(92vw,360px) }
      #gate-form h1{ margin:0 0 .25rem; font-size:1rem; font-weight:500; letter-spacing:.04em; text-transform:uppercase; opacity:.9 }
      #gate-form p{ margin:0; font-size:.85rem; opacity:.7 }
      #gate-form input,#gate-form button{
        padding:.75rem .9rem; border:1px solid rgba(255,255,255,.15);
        background:#0f0f0f; color:#fff; font-family:inherit;
      }
      #gate-form input:focus,#gate-form button:focus{ outline:2px solid rgba(255,255,255,.35); outline-offset:2px }
      #gate-form button{ cursor:pointer; background:#171717 }
      #gate-error{ color:#ff6b6b; font-size:.85rem; margin-top:.25rem }

      /* Global preview banner */
      #preview-banner{
        position:fixed; top:12px; left:12px; z-index: 1000;
        display:flex; align-items:center; gap:.5rem;
        padding:.45rem .6rem;
        font: 12px/1.2 "Space Mono","IBM Plex Mono",monospace;
        color:#fff; background:rgba(0,0,0,.7);
        border:1px solid rgba(255,255,255,.15); border-radius:4px;
        backdrop-filter: blur(3px);
      }
      #preview-banner button{
        margin-left:.25rem; padding:.25rem .5rem;
        font: inherit; color:#fff; background:#171717;
        border:1px solid rgba(255,255,255,.2); border-radius:3px;
        cursor:pointer;
      }
      #preview-banner button:focus{ outline:2px solid rgba(255,255,255,.35); outline-offset:2px }
    </style>

    <script>
      /** Client-side staging gate with session-scoped auth */
      const PASSWORD_SHA256_HEX = "71fda146532786e988d6adec68b1f77401808117ce27b16ceb35f410b726a5ad";
      const TOKEN_KEY = "preview_authed_v1";

      /* hex <-> buffer + constant-time compare */
      function bufToHex(buf){ return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,"0")).join(""); }
      function safeEqualHex(a,b){ if(a.length!==b.length) return false; let x=0; for(let i=0;i<a.length;i++) x|=a.charCodeAt(i)^b.charCodeAt(i); return x===0; }
      async function sha256Hex(s){ const d=await crypto.subtle.digest("SHA-256", new TextEncoder().encode(s)); return bufToHex(d); }

      async function gateInit(){
        const gate = document.getElementById("gate");
        const app  = document.getElementById("app");
        const form = document.getElementById("gate-form");
        const input= document.getElementById("gate-input");
        const err  = document.getElementById("gate-error");
        const banner = document.getElementById("preview-banner");
        const logout = document.getElementById("logout");

        function showApp(){
          gate.style.display = "none";
          app.hidden = false;
          banner.style.display = "flex";
        }

        // already authed this tab?
        if (sessionStorage.getItem(TOKEN_KEY) === "ok") {
          showApp();
        } else {
          app.hidden = true;
        }

        form.addEventListener("submit", async (e)=>{
          e.preventDefault();
          err.hidden = true;
          const pass = input.value || "";
          try{
            const hash = await sha256Hex(pass);
            if (safeEqualHex(hash, PASSWORD_SHA256_HEX)) {
              sessionStorage.setItem(TOKEN_KEY, "ok");
              showApp();
              input.value = "";
            } else {
              await new Promise(r=>setTimeout(r, 200));
              err.hidden = false;
              input.select();
            }
          } catch(ex){
            err.hidden = false;
            console.error("hash error", ex);
          }
        });

        // Logout clears session and returns to gate
        logout?.addEventListener("click", ()=>{
          sessionStorage.removeItem(TOKEN_KEY);
          app.hidden = true;
          document.getElementById("gate").style.display = "grid";
          location.reload();
        });

        // focus the input shortly after load
        setTimeout(()=>input?.focus(), 50);
      }

      document.addEventListener("DOMContentLoaded", gateInit);
    </script>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
