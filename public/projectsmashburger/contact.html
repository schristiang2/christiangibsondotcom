<section class="ps-contact" style="padding: 94px 29px 90px">
<div style="display: flex; flex-wrap: wrap; gap: 56px 126px; align-items: flex-start">
<div style="flex: 1 1 460px; max-width: 570px; min-width: 0">
<h2 style="margin: 0; font-weight: 700; font-size: clamp(36px, 3.94vw, 56.68px); line-height: 1.2; letter-spacing: 0.01em">Contact Us</h2>
<p class="ps-lead" style="margin: 18px 0 0; font-size: clamp(18px, 1.72vw, 24.76px); line-height: 1.6">Have a question? Want to schedule us for an event? Craving a smash burger? Let’s talk!</p>
<p class="ps-lead" style="margin: 34px 0 0; font-size: clamp(18px, 1.72vw, 24.76px); line-height: 1.6"><a href="mailto:projectsmashburger@gmail.com" style="color: #1C1C1C; text-decoration: none">projectsmashburger@gmail.com</a><br><a href="tel:+18283989739" style="color: #1C1C1C; text-decoration: none">(828) 398-9739</a></p>
<a href="https://instagram.com/" class="ps-contact-insta" aria-label="Instagram" style="display: inline-flex; align-items: center; justify-content: center; margin: 130px 0 0 -12px; width: 44px; height: 44px; color: #1C1C1C">
<svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="5"></rect><circle cx="12" cy="12" r="4"></circle><circle cx="17.5" cy="6.5" r="0.6" fill="currentColor"></circle></svg>
</a>
</div>

<form aria-label="Contact form" data-ps-form="contact" style="flex: 1 1 460px; max-width: 686px; min-width: 0; display: flex; flex-direction: column; gap: 22px">
<fieldset style="margin: 0; padding: 0; border: 0">
<legend style="padding: 0; margin-bottom: 12px; font-size: 14.68px">Name</legend>
<div class="ps-name-grid" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px">
<div style="display: flex; flex-direction: column; gap: 6px"><label for="c-first" style="font-size: 11.27px">First Name <span style="color: #6B6B6B; font-size: 10px">(required)</span></label><input class="ps-input" id="c-first" name="firstName" type="text" required autocomplete="given-name" style="height: 46px; padding: 0 16px; box-sizing: border-box; border: 1px solid #A9A9A9; border-radius: 12px; background: #F8F8F8; color: #1C1C1C; font-size: 15px"></div>
<div style="display: flex; flex-direction: column; gap: 6px"><label for="c-last" style="font-size: 11.27px">Last Name <span style="color: #6B6B6B; font-size: 10px">(required)</span></label><input class="ps-input" id="c-last" name="lastName" type="text" required autocomplete="family-name" style="height: 46px; padding: 0 16px; box-sizing: border-box; border: 1px solid #A9A9A9; border-radius: 12px; background: #F8F8F8; color: #1C1C1C; font-size: 15px"></div>
</div>
</fieldset>
<div style="display: flex; flex-direction: column; gap: 6px"><label for="c-email" style="font-size: 14.68px">Email <span style="color: #6B6B6B; font-size: 10px">(required)</span></label><input class="ps-input" id="c-email" name="email" type="email" required autocomplete="email" style="height: 46px; padding: 0 16px; box-sizing: border-box; border: 1px solid #A9A9A9; border-radius: 12px; background: #F8F8F8; color: #1C1C1C; font-size: 15px"></div>
<div style="display: flex; flex-direction: column; gap: 6px"><label for="c-msg" style="font-size: 14.68px">Message <span style="color: #6B6B6B; font-size: 10px">(required)</span></label><textarea class="ps-input" id="c-msg" name="message" rows="4" required style="min-height: 100px; padding: 12px 16px; box-sizing: border-box; border: 1px solid #A9A9A9; border-radius: 12px; background: #F8F8F8; color: #1C1C1C; font-size: 15px; resize: vertical"></textarea></div>
<button type="submit" style="align-self: flex-start; height: 50px; padding: 0 23px; border: 0; border-radius: 0; background: #000; color: #fff; font-family: 'Helvetica Neue', Arial, sans-serif; font-weight: 700; font-size: 17.2px; cursor: pointer">Send</button>
</form>
<div role="status" data-ps-success hidden style="flex: 1 1 460px; max-width: 686px; padding-top: 40px">
<p style="margin: 0; font-size: clamp(18px, 1.72vw, 24.76px); line-height: 1.6">Thank you!</p>
</div>
</div>
