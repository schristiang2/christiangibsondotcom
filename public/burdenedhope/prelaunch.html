<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="BurdenedHope website redesign concept by Christian Gibson.">
<title>BurdenedHope — Coming soon</title>

<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=UnifrakturCook:wght@700&amp;family=Cormorant+Garamond:wght@300;400;500&amp;family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&amp;display=swap"><style>
body{margin:0;background:#121110}
a{color:inherit}a:hover{opacity:.8}
@media (max-width:520px){header img{height:34px !important}header a[href="#enter"]{font-size:11px !important;letter-spacing:.06em !important}}
[id]{scroll-margin-top:130px}
</style></head>
<body>


<div style="font-family: 'EB Garamond', Garamond, Georgia, serif; color: #ECE5D8; background: #121110; min-height: 100vh; display: flex; flex-direction: column">

<header style="max-width: 1360px; width: 100%; margin: 0 auto; box-sizing: border-box; padding-bottom: 8px">
<div style="max-width: 1360px; margin: 0 auto; padding: 16px 24px 8px; display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: 16px">
<div style="justify-self: start; display: flex; align-items: center"></div>
<a href="/burdenedhope" aria-label="BurdenedHope home" style="display: flex; justify-content: center"><img src="/burdenedhope/images/logo-bone.png" alt="BurdenedHope" style="height: 44px; width: auto; display: block"></a>
<div style="justify-self: end; display: flex; align-items: center"><a href="#enter" style="font-size: 13px; letter-spacing: .12em; text-transform: uppercase; min-height: 44px; display: inline-flex; align-items: center; text-align: right">Enter with password</a></div>
</div>

</header>

<main style="flex: 1; max-width: 1360px; width: 100%; margin: 0 auto; padding: 48px 32px 80px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: center; gap: 48px">
<div style="display: flex; flex-direction: column; gap: 20px">
<p style="margin: 0; font-size: 13px; letter-spacing: .28em; text-transform: uppercase; color: #C9B48A">Series 01 · The Foundation</p>
<h1 style="margin: 0; font-weight: 400; line-height: .86">
<span style="display: block; font-family: 'UnifrakturCook', 'Old English Text MT', serif; font-size: clamp(59px, 11.5vw, 180.4px); font-weight: 700; letter-spacing: 0">Burden</span>
<span style="display: block; font-family: 'Cormorant Garamond', Georgia, serif; font-weight: 300; font-size: clamp(32px, 4vw, 60px); color: #C9C0B3; margin-top: 16px">Collection 01 — drops [LAUNCH DATE]</span>
</h1>
</div>

<div role="timer" aria-label="Countdown to launch" style="display: grid; grid-template-columns: repeat(4, minmax(0, 120px)); gap: 12px">
<div style="border: 1px solid #2E2A26; padding: 18px 12px; text-align: center; display: flex; flex-direction: column; gap: 6px"><span style="font-family: 'UnifrakturCook', 'Old English Text MT', serif; font-size: 36.1px; font-weight: 700; letter-spacing: 0">00</span><span style="font-size: 13px; letter-spacing: .18em; text-transform: uppercase; color: #9A9184">Days</span></div>
<div style="border: 1px solid #2E2A26; padding: 18px 12px; text-align: center; display: flex; flex-direction: column; gap: 6px"><span style="font-family: 'UnifrakturCook', 'Old English Text MT', serif; font-size: 36.1px; font-weight: 700; letter-spacing: 0">00</span><span style="font-size: 13px; letter-spacing: .18em; text-transform: uppercase; color: #9A9184">Hours</span></div>
<div style="border: 1px solid #2E2A26; padding: 18px 12px; text-align: center; display: flex; flex-direction: column; gap: 6px"><span style="font-family: 'UnifrakturCook', 'Old English Text MT', serif; font-size: 36.1px; font-weight: 700; letter-spacing: 0">00</span><span style="font-size: 13px; letter-spacing: .18em; text-transform: uppercase; color: #9A9184">Min</span></div>
<div style="border: 1px solid #2E2A26; padding: 18px 12px; text-align: center; display: flex; flex-direction: column; gap: 6px"><span style="font-family: 'UnifrakturCook', 'Old English Text MT', serif; font-size: 36.1px; font-weight: 700; letter-spacing: 0">00</span><span style="font-size: 13px; letter-spacing: .18em; text-transform: uppercase; color: #9A9184">Sec</span></div>
</div>

<form aria-label="Get early access" style="display: flex; flex-direction: column; gap: 10px; max-width: 560px">
<label for="hype-email" style="font-size: 13px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase">Get first access to the drop</label>
<div style="display: flex; flex-wrap: wrap">
<input id="hype-email" type="email" placeholder="you@example.com" style="flex: 1 1 240px; min-height: 54px; padding: 0 16px; border: 1px solid #ECE5D8; background: transparent; color: #ECE5D8; font: inherit; font-size: 16px">
<button type="button" style="min-height: 54px; padding: 0 28px; background: #C9B48A; color: #121110; border: 1px solid #C9B48A; font: inherit; font-size: 13px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; cursor: pointer">Notify me</button>
</div>
</form>

<div style="display: flex; gap: 32px; flex-wrap: wrap; border-top: 1px solid #2A2724; padding-top: 28px; align-items: baseline">
<span style="font-size: 13px; letter-spacing: .2em; text-transform: uppercase; color: #9A9184">The series</span>
<span style="font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: 22px; text-transform: uppercase; color: #C9B48A; font-weight: 600">01 Burden</span>
<span style="font-family: 'Cormorant Garamond', Georgia, serif; font-size: 26px; color: #8C8478">02 Perspective</span>
<span style="font-family: 'Cormorant Garamond', Georgia, serif; font-size: 26px; color: #8C8478">03 Obedience</span>
<span style="margin-left: auto; font-size: 13px; letter-spacing: .14em; text-transform: uppercase; color: #C9C0B3">Matthew 11:28</span>
</div>
</main>
</div>




<script src="/burdenedhope/js/preview-bar.js"></script>
</body></html>
